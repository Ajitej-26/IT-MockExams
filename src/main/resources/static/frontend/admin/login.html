<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IT-MockExams - Admin Login</title>

    <link rel="stylesheet"
          href="../css/admin-login.css">

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>
                IT-MockExams
            </h1>

            <h2>
                Admin Login
            </h2>

            <p class="subtitle">
                Sign in to manage the examination portal.
            </p>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="errorMessage"
               class="error-message">
            </p>

        </div>

    </main>


    <script src="../js/admin/login.js"></script>

</body>

</html>
