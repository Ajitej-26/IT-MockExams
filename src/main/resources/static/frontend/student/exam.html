<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>IT-MockExams - Exam</title>
    <link rel="stylesheet"
          href="../css/exam.css">
</head>
<body>

<!-- Header -->
    <header class="exam-header">
        <div class="header-container">
            <h1>IT-MockExams</h1>
             <div class="exam-info">
			    <span id="examTitle">
			        Mock Exam
			    </span>
		    <span id="timer">
		        00:00
		    </span>
		   </div>
        </div>
    </header>


<!-- Main Exam Area -->
    <main class="exam-container">

<!-- Loading -->
        <div id="loadingMessage">
            Loading questions...
        </div>

<!-- Questions will appear here -->
        <div id="questionsContainer"></div>

 <!-- Submit Button -->
        <div class="submit-section">
            <button id="submitBtn">
                Submit Exam
            </button>
        </div>
    </main>

<!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <span>
                IT-MockExams — Online Mock Examination Portal
            </span>
            <span>
                &copy; 2026 IT-MockExams. All Rights Reserved.
            </span>

        </div>
    </footer>
    <script src="../js/student/exam.js"></script>
</body>
</html>
