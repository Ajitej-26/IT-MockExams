<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-MockExams — Exam In Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/exam.css">
</head>
<body>

<div class="exam-shell">
  <div class="exam-topbar">
    <span class="title">General Aptitude — Round 2</span>
    <span class="timer" id="exam-timer">45:00</span>
  </div>
  <div class="exam-body">
    <div class="question-pane">
      <div class="q-count">QUESTION <span id="q-current">1</span> OF <span id="q-total">10</span></div>
      <div class="q-text" id="q-text">Loading question…</div>
      <div class="q-options" id="q-options"></div>
      <div class="exam-nav-row">
        <button class="btn ghost" id="q-prev">Previous</button>
        <button class="btn primary" id="q-next">Save &amp; Next</button>
      </div>
    </div>
    <div class="q-palette">
      <h4 class="mono">QUESTION PALETTE</h4>
      <div class="palette-grid" id="q-palette"></div>
      <button class="btn primary submit-exam-btn" id="submit-exam-btn">Submit exam</button>
    </div>
  </div>
</div>

<script src="../js/exam.js"></script>
</body>
</html>
