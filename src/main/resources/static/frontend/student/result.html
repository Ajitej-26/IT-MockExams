<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>IT-MockExams - Result</title>
    <link rel="stylesheet"
          href="../css/result.css">
</head>
<body>

    <!-- Header -->

    <header class="result-header">

        <div class="header-container">

            <h1>IT-MockExams</h1>

            <span>Exam Result</span>

        </div>

    </header>


    <!-- Result -->

    <main class="result-container">

        <div class="result-card">

            <h2>Exam Completed!</h2>

            <p id="examTitle">
                Java Fundamentals
            </p>


            <div class="score">

                <span id="score">
                    0
                </span>

                <span>
                    /
                </span>

                <span id="totalQuestions">
                    0
                </span>

            </div>


            <p class="score-label">
                Your Score
            </p>
            
            <div class="result-details">
                <div>
                    <strong>Correct Answers</strong>
                    <span id="correctAnswers">0</span>
                </div>

                <div>
                    <strong>Total Questions</strong>
                    <span id="total">0</span>
                </div>

                <div>
                    <strong>Percentage</strong>
                    <span id="percentage">0%</span>
                </div>
            </div>
            <button id="dashboardBtn">
                Back to Dashboard
            </button>
        </div>
    </main>

<!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <span>
                IT-MockExams — Online Mock Examination Portal
            </span>
            <span>
                &copy; 2026 IT-MockExams. All Rights Reserved.
            </span>
        </div>
    </footer>
    <script src="../js/student/result.js"></script>
</body>
</html>
