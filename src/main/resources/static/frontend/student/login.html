<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | IT-MockExams</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="page-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    IT<span>-</span>MockExams
                </div>
                <h1>Welcome Back</h1>
                <p>
                    Sign in to continue your mock exam practice.
                </p>
            </div>
            <form id="loginForm">
            
                <!-- Email -->
                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                    <small
                        class="error-message"
                        id="emailError">
                    </small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">
                        Password
                    </label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle">
                            Show
                        </button>
                    </div>
                    <small
                        class="error-message"
                        id="passwordError">
                    </small>
                </div>

                <!-- Message -->
                <div
                    id="formMessage"
                    class="form-message">
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">
                    Sign In
                </button>
            </form>
            
            <!-- Register -->
            <div class="register-section">
                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>
            </div>
        </div>
    </div>
    <script src="../js/student/login.js"></script>
</body>
</html>
